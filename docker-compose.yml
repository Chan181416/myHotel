

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: myhotel_sql
    environment:
      SA_PASSWORD: "1234567!Cb"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  server:
    build: ./server
    container_name: myhotel_server
    depends_on:
        sqlserver:
          condition: service_healthy
    environment:
      SERVER_URL: http://server:5044
      ASPNETCORE_URLS: http://+:5044
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=Hotel;User Id=sa;Password=1234567!Cb;MultipleActiveResultSets=true;Encrypt=False;TrustServerCertificate=True;"
    ports:
      - "5011:5044"

  gateway:
    build: ./hotel-management-gateway
    container_name: myhotel_gateway
    depends_on:
      - server
    ports:
      - "3001:3000"

  client:
    build: ./client
    container_name: myhotel_client
    depends_on:
      - gateway
    ports:
      - "80:80"

volumes:
  sql_data: