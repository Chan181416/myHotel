version: '3.9'

services:

  client:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - nodeapi

  nodeapi:
    build: ./node-api
    ports:
      - "5000:5000"
    depends_on:
      - csharpapi

  csharpapi:
    build: ./csharp-api
    ports:
      - "7000:80"
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "YourStrong@Pass123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
